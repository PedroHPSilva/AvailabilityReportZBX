# A porta 80/443 já é usada pelo frontend do Zabbix e a 3000 pelo Grafana
# neste servidor, então esta aplicação fica na porta 8080. O "Listen" abaixo
# é necessário porque 8080 normalmente não está em /etc/apache2/ports.conf.
Listen 8080

<VirtualHost *:8080>
    ServerName zabbix-automation

    DocumentRoot /opt/zabbix_automation/frontend/dist

    # Proxy reverso: tudo em /api/ vai para o backend FastAPI/Uvicorn
    # (127.0.0.1:8000). O prefixo /api/ é removido na chamada ao backend.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    <Directory /opt/zabbix_automation/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Frontend estático (build gerado por "npm run build" em frontend/dist).
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zabbix-automation-error.log
    CustomLog ${APACHE_LOG_DIR}/zabbix-automation-access.log combined
</VirtualHost>
