# Use este arquivo (em vez de zabbix-automation.conf) quando o Zabbix for
# acessado via https:// -- nesse caso o navegador bloqueia por "Mixed
# Content" um iframe carregado via http://, então a aplicação também
# precisa responder em HTTPS na porta 8080.
#
# Não é necessário gerar um certificado novo: como é o MESMO domínio já
# usado pelo Zabbix, basta reaproveitar os mesmos arquivos de certificado
# do vhost do Zabbix (ajuste os caminhos abaixo). Para descobrir onde eles
# estão:
#   sudo grep -rE "SSLCertificateFile|SSLCertificateKeyFile|SSLCertificateChainFile" \
#     /etc/apache2/sites-enabled/*.conf
#
# Requer o modulo mod_ssl habilitado: sudo a2enmod ssl

Listen 8080 https

<VirtualHost *:8080>
    ServerName zabbix.SEU_DOMINIO

    SSLEngine On
    SSLCertificateFile    /caminho/para/o/mesmo/fullchain.pem
    SSLCertificateKeyFile /caminho/para/o/mesmo/privkey.pem
    # Se o vhost original do Zabbix usar SSLCertificateChainFile (comum em
    # certificados corporativos/CA interna, não Let's Encrypt), replique
    # aqui também:
    # SSLCertificateChainFile /caminho/para/a/mesma/chain.pem

    DocumentRoot /opt/zabbix_automation/frontend/dist

    # Proxy reverso: tudo em /api/ vai para o backend FastAPI/Uvicorn
    # (127.0.0.1:8000). O prefixo /api/ é removido na chamada ao backend.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    <Directory /opt/zabbix_automation/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Frontend estático (build gerado por "npm run build" em frontend/dist).
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zabbix-automation-error.log
    CustomLog ${APACHE_LOG_DIR}/zabbix-automation-access.log combined
</VirtualHost>
