server {
    # Use este arquivo (em vez de zabbix-automation.conf) quando o Zabbix
    # for acessado via https:// -- nesse caso o navegador bloqueia por
    # "Mixed Content" um iframe carregado via http://, então a aplicação
    # também precisa responder em HTTPS na porta 8080.
    #
    # Não é necessário gerar um certificado novo: como é o MESMO domínio já
    # usado pelo Zabbix, basta reaproveitar os mesmos arquivos de
    # certificado do vhost do Zabbix (ajuste os caminhos abaixo). Para
    # descobrir onde eles estão:
    #   sudo grep -rE "SSLCertificateFile|SSLCertificateKeyFile|ssl_certificate " \
    #     /etc/apache2/sites-enabled/* /etc/nginx/sites-enabled/* 2>/dev/null
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name zabbix.SEU_DOMINIO;

    ssl_certificate     /caminho/para/o/mesmo/fullchain.pem;
    ssl_certificate_key /caminho/para/o/mesmo/privkey.pem;

    root /opt/zabbix_automation/frontend/dist;
    index index.html;

    access_log /var/log/nginx/zabbix-automation.access.log;
    error_log  /var/log/nginx/zabbix-automation.error.log;

    # Proxy reverso: tudo em /api/ vai para o backend FastAPI/Uvicorn (127.0.0.1:8000).
    # O prefixo /api/ é removido na chamada ao backend (barra final no proxy_pass).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Frontend estático (build gerado por "npm run build" em frontend/dist)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
