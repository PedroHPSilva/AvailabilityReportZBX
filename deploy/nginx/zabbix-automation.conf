server {
    # 80/443 já são usados pelo frontend web do próprio Zabbix neste servidor.
    # Esta aplicação fica disponível na porta 8080, em todas as interfaces
    # de rede (0.0.0.0), para ser acessada por outras máquinas da rede.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/zabbix_automation/frontend/dist;
    index index.html;

    access_log /var/log/nginx/zabbix-automation.access.log;
    error_log  /var/log/nginx/zabbix-automation.error.log;

    # Proxy reverso: tudo em /api/ vai para o backend FastAPI/Uvicorn (127.0.0.1:8000).
    # O prefixo /api/ é removido na chamada ao backend (barra final no proxy_pass).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Frontend estático (build gerado por "npm run build" em frontend/dist)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
